<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h1>Student Management System</h1>
    
    <div class="navigation">
        <a href="{{ url_for('index') }}">Home</a>
        <a href="{{ url_for('students') }}">View Students</a>
    </div>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="alert">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <!-- Form တစ်ခုတည်းသာ ထားရှိသည် (Double Form မရှိတော့ပါ) -->
    <form method="POST">
        <div class="form-heading">
            <h2>Add New Student</h2>
            <p>Fill in the details below to add a student.</p>
        </div>

        <label for="name">Student Name</label>
        <input type="text" id="name" name="name" placeholder="Enter full name" required>
        
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="name@example.com" required>
        
        <div class="form-actions">
            <button type="submit" class="submit-btn">Save Student</button>
            <a href="{{ url_for('students') }}" class="cancel-btn">Cancel</a>
        </div>
    </form>
</body>
</html>
