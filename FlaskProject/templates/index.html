
<!DOCTYPE html>
<html>
<head>
    <title>Student Form</title>
</head>
<body>
    <h2>Student Form</h2>

    <form action="/submit" method="POST">
        Name:
        <input type="text" name="name" required>
        <br><br>

        Age:
        <input type="number" name="age" min="2" required>
        <br><br>

        University:
        <input type="text" name="uni" required>
        <br><br>

        <button type="submit">Send</button>
    </form>
</body>
</html>
